[project]
name = "labassistant"
version = "0.1.0"
description = "An agentic Socratic tutor that assesses understanding of core computing concepts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # The code runner executes task tests with pytest in a subprocess.
    "pytest>=8.0",
]

[project.scripts]
labassistant-diagnose = "labassistant.diagnosis.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labassistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: style, F: pyflakes, I: import order, B: bugbear (likely bugs), UP: modern syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
