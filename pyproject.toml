[project]
name = "labassistant"
version = "0.1.0"
description = "An agentic Socratic tutor that assesses understanding of core computing concepts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # The code runner executes task tests with pytest in a subprocess.
    "pymupdf>=1.24",
    "pytest>=8.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Heavy, only needed to transcribe lectures: uv sync --extra materials
materials = [
    "faster-whisper>=1.0",
]
# Marker/dev dashboard: uv sync --extra dashboard
dashboard = [
    "streamlit>=1.40",
]

[project.scripts]
labassistant-diagnose = "labassistant.diagnosis.cli:main"
labassistant-materials = "labassistant.materials.cli:main"
labassistant-api = "labassistant.api.main:run"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labassistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: style, F: pyflakes, I: import order, B: bugbear (likely bugs), UP: modern syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Noise from PyMuPDF's generated C bindings, not our code.
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
    # Starlette's test client uses a deprecated anyio alias; not our code.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
